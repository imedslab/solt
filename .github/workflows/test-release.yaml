name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git Tag (Release) to validate and upload'
        required: true
        type: string

jobs:
  test-all:
    name: Run Tests and Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests --cov solt --cov-report=xml --junitxml=./junit.xml

      - name: Check code formatting
        run: uv run black --config=black.toml --check .

      - name: Run flake8 linter
        run: uv run flake8

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-and-publish:
    name: Build and Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: test-all
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"

      - name: Set name and version for TestPyPI
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i 's/^name = "solt"$/name = "solt-test"/' pyproject.toml
          sed -i "s/^__version__ = \"[^\"]*\"/__version__ = \"$VERSION\"/" solt/__init__.py

      - name: Build package
        run: uv build

      - name: Validate built packages with twine
        run: uvx twine check dist/*
      
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API }}
          packages-dir: dist/
          verbose: true

    
