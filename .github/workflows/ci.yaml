name: CI (Test & Lint)

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test-all:
    name: Test Master Branch
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests --cov solt --cov-report=xml --junitxml=./junit.xml

      - name: Check code formatting
        run: uv run black --config=black.toml --check .

      - name: Run flake8 linter
        run: uv run flake8

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
