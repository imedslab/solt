name: CI (Test & Lint)

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test-all:
    name: Test Master Branch
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests --cov solt --cov-report=xml --cov-report=term-missing --junitxml=./junit.xml

      - name: Check code formatting
        run: uv run black --config=black.toml --check .

      - name: Run flake8 linter
        run: uv run flake8

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          disable_search: true
          report_type: test_results

  test-lowest:
    name: Test Lowest Supported Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the lowest versions allowed by pyproject.toml
        run: uv sync --resolution lowest-direct

      - name: Run tests
        run: uv run --no-sync pytest tests
